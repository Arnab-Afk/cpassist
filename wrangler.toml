# Wrangler configuration for Cloudflare Worker
name = "google-oauth-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# Environment variables
[vars]
BACKEND_URL = "http://localhost:8080/api"

# For production, update BACKEND_URL to your actual backend domain:
# [env.production.vars]
# BACKEND_URL = "https://your-backend-domain.com/api"

# Routes configuration
# This should match your worker domain
# routes = [
#   { pattern = "small-mouse-2759.arnabbhowmik019.workers.dev/google/auth", zone_name = "workers.dev" }
# ]
